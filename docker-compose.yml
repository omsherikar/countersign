name: countersign

x-api-env: &api-env
  env_file: .env
  environment:
    POSTGRES_HOST: postgres
    REDIS_URL: redis://redis:6379/0
    MOCKGOV_BASE_URL: http://mockgov:8001
    SMTP_HOST: mailpit
    SMTP_PORT: "1025"
    # source calls in flight per batch: mockgov's one process keeps 5 database connections and
    # opens a new one for every request beyond them
    CHECKS_CONCURRENCY: "5"

services:
  postgres:
    image: postgres:17
    env_file: .env
    environment:
      POSTGRES_DB: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init.sh:/docker-entrypoint-initdb.d/10-databases.sh:ro
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ["${REDIS_HOST_PORT:-6379}:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:latest
    ports: ["8025:8025", "1025:1025"]
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
      # keeps every notice of a full seed (the default is 500)
      MP_MAX_MESSAGES: "20000"

  api:
    build: ./services/api
    <<: *api-env
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --timeout-keep-alive 75
    volumes:
      - ./services/api:/app
      - ./rules.yaml:/app/rules.yaml:ro
      - generated:/data/generated
      - upload-spool:/data/spool
      - case-files:/data/case-files
    ports: ["8000:8000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      mockgov: { condition: service_started }
      mailpit: { condition: service_started }
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8000/healthz')\""]
      interval: 10s
      timeout: 5s
      retries: 12

  worker:
    build: ./services/api
    <<: *api-env
    # one upload at a time, so cross-institution duplicate detection never races
    command: celery -A app.worker.celery_app worker --loglevel=info --pool=solo --concurrency=1
    volumes:
      - ./services/api:/app
      - ./rules.yaml:/app/rules.yaml:ro
      - generated:/data/generated
      - upload-spool:/data/spool
      - case-files:/data/case-files
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      mailpit: { condition: service_started }

  mockgov:
    build: ./services/mockgov
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
    command: uvicorn app.main:app --host 0.0.0.0 --port 8001 --reload
    volumes:
      - ./services/mockgov:/app
      - generated:/data/generated
    ports: ["8001:8001"]
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8001/healthz')\""]
      interval: 10s
      timeout: 5s
      retries: 12

  # `make eval` only. The same simulator image and database as mockgov, with several worker
  # processes and no reload, so the 50,000-row run is not limited by one simulator process.
  # The demo's mockgov keeps its single reloading process: chaos toggles live in process
  # memory, and several workers would each keep their own.
  mockgov-eval:
    image: countersign-mockgov
    pull_policy: never
    profiles: ["eval"]
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
    command: uvicorn app.main:app --host 0.0.0.0 --port 8001 --workers 4 --no-access-log
    volumes:
      - ./services/mockgov:/app
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8001/healthz')\""]
      interval: 5s
      timeout: 5s
      retries: 12

  # `make eval`: python -m eval in the api image, with tools/eval mounted at /eval. It runs
  # the engine in process against mockgov-eval and writes tools/eval/out/.
  eval:
    image: countersign-api
    pull_policy: never
    profiles: ["eval"]
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      REDIS_URL: redis://redis:6379/0
      MOCKGOV_BASE_URL: http://mockgov-eval:8001
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      PYTHONPATH: /eval
      # the evaluation asks for thousands of pages from one process
      RATE_LIMITS_ENABLED: "false"
      # four checking processes with four calls each, inside the 20 database connections
      # mockgov-eval's four workers keep
      CHECKS_CONCURRENCY: "16"
    working_dir: /app
    entrypoint: ["python", "-m", "eval"]
    volumes:
      - ./services/api:/app
      - ./rules.yaml:/app/rules.yaml:ro
      - ./tools/eval:/eval
      - generated:/data/generated
      - upload-spool:/data/spool
      - case-files:/data/case-files
    depends_on:
      postgres: { condition: service_healthy }
      mockgov-eval: { condition: service_healthy }

  datagen:
    build: ./tools/datagen
    profiles: ["tools"]
    volumes:
      - ./tools/datagen:/app
      - ./rules.yaml:/app/rules.yaml:ro
      - generated:/data/generated
    entrypoint: ["datagen"]

  web:
    build:
      context: ./apps/web
      target: dev
    env_file: .env
    environment:
      API_INTERNAL_URL: http://api:8000
    command: pnpm dev
    volumes:
      - ./apps/web:/app
      - web_node_modules:/app/node_modules
      - web_next:/app/.next
    ports: ["3000:3000"]
    depends_on:
      api: { condition: service_started }

volumes:
  pgdata:
  generated:
  upload-spool:
  case-files:
  web_node_modules:
  web_next:
