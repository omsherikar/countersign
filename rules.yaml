# Countersign rules. Every number carries its source so the panel can see provenance.
# Seat pools are built per approval (programme x academic year) from approved_intake.
# Percentages round half up to whole seats; a pool never drops below 0.

handbook:
  edition: "AICTE Approval Process Handbook 2024-25 to 2026-27 (with 2026-27 addendum)"
  verified_on: "2026-10-28"

seat_pools:
  REGULAR:
    share: 1.00                 # of approved intake, minus the NRI carve-out
    supernumerary: false
    source: "AICTE approved intake"
  NRI:
    share: 0.05
    carved_from: REGULAR        # NRI seats sit WITHIN approved intake
    supernumerary: false
    unfilled: "revert to general candidates at regular fee"
    source: "APH 2024-27 cl. 2.8(b)"
  TFW:
    share: 0.05
    supernumerary: true
    condition: "only for courses that filled >= 50% of approved intake last year"
    unfilled: "not reallocated to any other category"
    source: "APH 2024-27 cl. 6.42(d)(i), (d)(iii)"
  LATERAL:
    share: 0.10
    supernumerary: true
    plus_first_year_vacancies: true
    source: "APH 2024-27 cl. 6.13(a), 6.13(f)"
  INTERNATIONAL:                # Foreign Nationals / OCI / PIO / Children of Indian Workers in Gulf
    supernumerary: true
    ciwg_reserved_fraction: 0.3333   # one third of these seats for CIWG
    unfilled: "cannot be allocated to anyone other than an international student (from 2026-27)"
    slabs:
      - match: {discipline_group: ENGINEERING, level: [DIPLOMA, UG]}
        share: 0.15
        source: "APH 2024-27 cl. 2.9; APH 2026-27 addendum keeps 15% for Engg Diploma/UG"
      - match: {discipline_group: ENGINEERING, level: [PG]}
        share: 0.25
        source: "APH 2026-27 addendum (PG Engineering raised to 25%)"
      - match: {discipline_group: [MANAGEMENT, COMPUTER_APPLICATIONS, DESIGN, PLANNING, HOTEL_MANAGEMENT, APPLIED_ARTS], level: [DIPLOMA, UG, PG]}
        share: 0.25
        source: "APH 2026-27 addendum (25% all levels)"
    lateral_combined_cap: 0.15  # FN under supernumerary + FN via lateral <= 15% of approved intake
    lateral_combined_cap_source: "APH 2024-27 cl. 6.13(b)"

# EWS is a reservation category inside approved intake, not a seat pool.
reservation:
  EWS:
    share: 0.10
    source: "APH 2024-27 cl. 4.6"

admission_routes:
  # which seat pool an admission route may consume, and which source holds the joining:
  # the state admission authority approves management, NRI and spot admissions too (D39);
  # international admissions are in Study in India
  COUNSELLING:   {pool: REGULAR,       admission_check: JOINING_RECORD}
  MANAGEMENT:    {pool: REGULAR,       admission_check: JOINING_RECORD}
  NRI:           {pool: NRI,           admission_check: JOINING_RECORD}
  TFW:           {pool: TFW,           admission_check: JOINING_RECORD}
  LATERAL:       {pool: LATERAL,       admission_check: JOINING_RECORD}
  SPOT:          {pool: REGULAR,       admission_check: JOINING_RECORD}
  INTERNATIONAL: {pool: INTERNATIONAL, admission_check: STUDY_IN_INDIA}

eligibility:
  # who may hold each seat type, as the college reports it (D41); a breach makes the Seat
  # row Contradicted with the clause
  INTERNATIONAL_CIWG:
    clause: "APH 2024-27 cl. 2.9"
    allowed: "Foreign nationals, OCI, PIO and CIWG students"
  NRI_STATUS:
    clause: "APH 2024-27 cl. 2.8(b)"
    allowed: "NRI or NRI-sponsored students"
  TFW_INCOME:
    clause: "APH 2024-27 cl. 6.42(d)"
    allowed: "Students with a family income certificate"

apaar:
  format: "^[0-9]{12}$"
  optional: true   # Supreme Court order July 2026 + DPDP Act: admission is never blocked on APAAR

name_matching:
  pass_threshold: 90
  review_threshold: 75
  dob_must_match: true

cutoff_dates:
  # academic_year -> last date for regular admission; refills after this raise LATE_REFILL
  "2026-27": "2026-09-15"

reporting:
  # academic_year -> the state admission authority's reporting deadline for joining records;
  # a joining year not listed has its deadline on 30 September of its start year
  deadline:
    "2026-27": "2026-09-30"
    "2025-26": "2025-09-30"
  source: "State admission authority reporting deadline"

dual_enrolment:
  # UGC 2022: one physical programme plus one ODL/online is allowed
  allowed_modes: [["PHYSICAL", "ODL"], ["PHYSICAL", "ONLINE"]]

notices:
  # the student notice loop; Countersign service levels, not handbook rules
  expiry_days: 30          # a notice link can be answered for this many days
  change_window_days: 7    # one change of answer allowed within this many days of the first reply
  resend_limit: 3          # resends per enrolment per academic year
  source: "Countersign DECISIONS D23, D24"

ghost_ring:
  min_component_cross_college: 3
  min_colleges: 2
  min_component_single_college: 5

signals:
  # officer-only signals (D45); never a record's status
  anomaly:
    # the share of colleges the Isolation Forest treats as outliers each year; 0.1 finds
    # both planted colleges of the small synthetic data, 0.05 misses the admission-growth one
    contamination: 0.1
    n_estimators: 200
    random_state: 0
    min_records: 20     # a college with fewer active records in the year is not scored
    source: "Countersign signal model (D45): Isolation Forest over this year's colleges"
