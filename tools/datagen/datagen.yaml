# Generation sizes and planted-anomaly counts. Every anomaly type has a toggle and a
# count per size. Counts include the named scenarios when --scenarios is on (the named
# scenario is planted first, then random instances fill the remainder).

academic_year: "2026-27"
upload_years: ["2026-27"]

sizes:
  small:
    institutions: 50
    target_students: 10000
    programmes_per_institution: [2, 5]
    year1_fill: [0.45, 0.95]
    xlsx: true
  full:
    institutions: 500
    target_students: 200000
    programmes_per_institution: [3, 6]
    year1_fill: [0.45, 0.95]
    xlsx: true

anomalies:
  EXCESS_ADMISSION:            {enabled: true, small: 4,  full: 30}
  QUOTA_BREACH_NRI:            {enabled: true, small: 3,  full: 20}
  QUOTA_BREACH_INTERNATIONAL:  {enabled: true, small: 2,  full: 12}
  DUPLICATE_WITHIN_UPLOAD:     {enabled: true, small: 12, full: 150}
  DUPLICATE_CROSS_INSTITUTION: {enabled: true, small: 10, full: 120}
  DUAL_ENROLMENT_ALLOWED:      {enabled: true, small: 3,  full: 20}
  GHOST_RING:                  {enabled: true, small: 3,  full: 15}
  INVALID_APAAR:               {enabled: true, small: 15, full: 200}
  NO_ACADEMIC_ACTIVITY:        {enabled: true, small: 12, full: 150}
  STUDENT_DENIED:              {enabled: true, small: 8,  full: 80}
  NAME_MISMATCH:               {enabled: true, small: 12, full: 150}
  # Legitimate rows that look unusual but must not be flagged. Listed in ground truth
  # with expected_flag null so the evaluation can score false positives.
  CONSENT_REFUSED_NO_APAAR:    {enabled: true, small: 20, full: 250}

# Update files, uploads/<aicte_id>_<year>_update1.csv (+ .xlsx): rows that change an
# earlier enrolment or add a late one. `colleges` per size counts ABC College, which always
# gets one when --scenarios is on. Each file withdraws and transfers a few students and
# refills, after the cutoff in rules.yaml, the seats some first-year withdrawals released.
updates:
  colleges:     {small: 3, full: 20}
  withdrawals:  [2, 4]
  transfers:    [1, 2]
  refills:      [1, 2]
  status_dates: ["2026-09-16", "2026-10-20"]

ghost_ring:
  size: [6, 12]
  colleges: [2, 3]
  shared_mobiles: [2, 3]

# graduates.jsonl: final-year students of the year before the roll, who have finished, for
# the university degree proof. New people, never on the roll. Most go to colleges affiliated
# to `university` (the coe@univ.demo login), at least `abc` of them at ABC College of
# Engineering; the rest to the `other_universities` universities with the most affiliated
# colleges. `provisional` of them have no APAAR, only a provisional id.
graduates:
  academic_year: "2025-26"
  year_of_award: 2026
  count:               {small: 40, full: 400}
  abc:                 {small: 12, full: 60}
  university:          "MSTU"
  university_share:    0.6
  other_universities:  3
  provisional:         [3, 5]
  status_dates:        ["2026-06-15", "2026-07-31"]

# Credits issuers (ABC): this share of colleges is autonomous and issues its own credits
# (XYZ Institute of Technology and every deemed university among them, ABC College never);
# every other college's credits are issued by its affiliating university.
autonomous_share: 0.30

# The state admission authority's joining records (mockgov/joining_records.jsonl) and the
# cases planted against them. `reporting_deadline` applies when rules.yaml has no
# reporting.deadline for the year; other years default to 30 September of their start year.
joining:
  reporting_deadline: {"2026-27": "2026-09-30"}
  joined_within_days: [0, 6]
  late_joiners:         {small: 3,  full: 25}   # clean first-years who joined after the deadline
  never_joined:         {small: 6,  full: 60}   # NOT_IN_JOINING_RECORD, the deck sample included
  omitted_colleges:     {small: 3,  full: 25}   # MISSING_FROM_UPLOAD, one record per college
  omitted_per_college:  [2, 6]

# Eligibility markers on upload rows (tfw_income_certified, nri_sponsored, ciwg; yes or no,
# blank when not reported) and the rows planted against them (API_CONTRACT A4.4).
eligibility:
  ciwg_rows:            {small: 2,  full: 12}   # CIWG students on CIWG-reserved seats
  nri_status:           {small: 1,  full: 6}    # ELIGIBILITY_BREACH: NRI seat, nri_sponsored no
  tfw_income:           {small: 1,  full: 6}    # ELIGIBILITY_BREACH: TFW seat, certificate no
  international_ciwg:   {small: 1,  full: 4}    # ELIGIBILITY_BREACH: nationality IN, not ciwg
  tfw_not_reported:     {small: 2,  full: 10}   # TFW row without the certificate: Seat PENDING

# Colleges planted for the anomaly model (signals, never a status) and history.json.
signals:
  admission_spike:      {small: 1,  full: 5}    # first-years far above last year's admissions
  nri_management_share: {small: 1,  full: 5}    # NRI and management share far above peers
  retention:            [0.90, 0.98]            # last year's admissions = second-years / this

# Records planted to check the record status rule (statuses.py): clean records countersigned
# by their joining line alone, and second-years whose only confirmed enrolment row is their
# own college's credits (their state has published no joining record for that year).
statuses:
  clean_independent:    {small: 5,  full: 20}
  self_issued_only:     {small: 3,  full: 12}
